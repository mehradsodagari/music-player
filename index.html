<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <script src="./script.js" defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="main">
      <img
        src="./4k-astronaut-with-planet-balloons-obmeigwjtm09atxj.jpg"
        alt="music cover"
        id="cover"
      />
      <h2 id="title"></h2>
      <p id="artist"></p>
      <div class="player-progress-wrapper">
        <div class="time-info">
          <span id="current-time">0:00</span>
          <span id="duration">0:00</span>
        </div>
        <div class="progress-bar" id="progress-bar">
          <div class="progress-bar-inner"></div>
        </div>
      </div>
      <div id="btns">
        <button id="previous"><i class="fa-solid fa-backward-step"></i></button>
        <button id="play">
          <i class="fa-solid fa-circle-play" id="status-icon"></i>
        </button>
        <button id="next"><i class="fa-solid fa-forward-step"></i></button>
      </div>
      <div id="sound">
        <input type="range" name="volume" id="volume" min="0" max="100" />
        <i class="fas fa-volume-medium" id="volume-icon"></i>
      </div>
      <div id="playlist">
        <h3 id="playlist-header">Playlist <i class="fa fa-list-ul"></i></h3>
        <ul id="playlist-list"></ul>
      </div>
      <audio src="" id="audio"></audio>
    </main>
  </body>
</html>
